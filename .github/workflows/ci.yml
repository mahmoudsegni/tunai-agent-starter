name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Offline: no API key, no network.
      - run: pytest

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a real TunAI key was committed
        run: |
          if git grep -nE 'sk-tunai-[A-Za-z0-9_-]{20,}' -- . ':!tests/'; then
            echo "::error::A TunAI API key is committed. Revoke it in the console, then remove it."
            exit 1
          fi
